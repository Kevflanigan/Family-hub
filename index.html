<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Hub</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #f0f6fc;
            --muted: #8b949e;
            --accent: #58a6ff;
            
            /* Family Member Colors */
            --mom: #ec4899;
            --dad: #3b82f6;
            --leo: #10b981;
            --mia: #f59e0b;
            --family: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-top: 60px;
            padding-bottom: 2rem;
            min-height: 100vh;
        }

        /* Fixed Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 55px;
            background: rgba(22, 27, 34, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 0.9rem;
        }

        .lock-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.78rem;
            cursor: pointer;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .page-title h1 {
            font-size: 1.35rem;
            font-weight: 800;
        }

        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Quick Add Form - Clean Mobile Layout */
        .add-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .form-input, .form-select {
            background: #0d1117;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent);
        }

        .input-full {
            flex: 1 1 60%;
            min-width: 140px;
        }

        .input-half {
            flex: 1 1 35%;
            min-width: 110px;
        }

        .add-btn {
            background: var(--accent);
            color: #0d1117;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            flex: 1 1 100%;
        }

        @media (min-width: 500px) {
            .add-btn {
                flex: 0 0 auto;
            }
        }

        /* Summary Toggle & Stats */
        .toggle-box {
            background: #0d1117;
            border: 1px solid var(--border);
            padding: 2px;
            border-radius: 8px;
            display: flex;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #ffffff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 0.75rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 0.6rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: var(--muted);
        }

        /* Horizontally Scrollable Calendar Container */
        .calendar-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(44px, 1fr));
            gap: 4px;
            min-width: 310px;
        }

        .day-header {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            padding-bottom: 6px;
        }

        .day-cell {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 6px;
            min-height: 75px;
            padding: 4px;
            position: relative;
            cursor: pointer;
        }

        .day-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .day-cell:not(.empty):hover {
            border-color: var(--accent);
        }

        .day-num {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
        }

        .event-pill {
            margin-top: 2px;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.6rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .bg-mom { background-color: var(--mom); }
        .bg-dad { background-color: var(--dad); }
        .bg-leo { background-color: var(--leo); }
        .bg-mia { background-color: var(--mia); }
        .bg-family { background-color: var(--family); }

        /* Floating Tooltip */
        #hover-tooltip {
            position: absolute;
            display: none;
            width: 210px;
            background: #1f2937;
            border: 1px solid #4b5563;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 0.65rem;
            z-index: 2000;
            pointer-events: none;
        }

        #hover-tooltip h4 {
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.2rem;
        }

        .tooltip-line {
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        /* Entertainment Tabs & List */
        .category-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .cat-tab {
            background: #0d1117;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .list-card, .todo-item {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .list-info h5 {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .list-info span {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .map-btn {
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            text-decoration: none;
            font-weight: 600;
        }

        .map-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .todo-text {
            font-size: 0.85rem;
        }

        .assign-tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            color: #fff;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">🏠</div>
            <span>Family Hub</span>
        </div>
        <button class="lock-btn">🔒 Kids Mode</button>
    </header>

    <main>
        <div class="page-title">
            <h1>Welcome Back, Family! 👋</h1>
        </div>

        <!-- Universal Quick Add -->
        <section class="card" style="border-color: var(--accent);">
            <div class="card-header" style="margin-bottom: 0.5rem;">
                <div class="card-title">Quick Add to Hub</div>
            </div>
            <form class="add-form" onsubmit="addItem(event)">
                <div class="form-row">
                    <input type="text" id="add-title" class="form-input input-full" placeholder="Enter title (e.g., Zoo Trip, Pizza Night)..." required>
                    <select id="add-category" class="form-select input-half">
                        <option value="calendar">Calendar Event</option>
                        <option value="cinema">Cinema Film</option>
                        <option value="home">Home Watch</option>
                        <option value="places">Place to Visit</option>
                        <option value="todo">To-Do Task</option>
                    </select>
                </div>
                <div class="form-row">
                    <input type="date" id="add-date" class="form-input input-half" value="2026-10-18">
                    <select id="add-assignee" class="form-select input-half">
                        <option value="family">Family</option>
                        <option value="mom">Mom</option>
                        <option value="dad">Dad</option>
                        <option value="leo">Leo</option>
                        <option value="mia">Mia</option>
                    </select>
                    <button type="submit" class="add-btn">Add to Hub</button>
                </div>
            </form>
        </section>

        <!-- Section 1: Dynamic Summary -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">Upcoming Summary</div>
                <div class="toggle-box">
                    <button class="toggle-btn active" id="btn-week" onclick="setSummary('week')">Week</button>
                    <button class="toggle-btn" id="btn-month" onclick="setSummary('month')">Month</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" id="num-events">3</div>
                    <div class="stat-lbl">Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="num-tasks">4</div>
                    <div class="stat-lbl">Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="num-trips">1</div>
                    <div class="stat-lbl">Outings</div>
                </div>
            </div>

            <p id="summary-desc" style="font-size:0.82rem; color:var(--muted);">
                Week ahead: 3 scheduled activities including Football Training and Family Movie Night.
            </p>
        </section>

        <!-- Section 2: Shared Calendar -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">Shared Calendar</div>
                <span style="font-size:0.75rem; color:var(--muted);">October 2026</span>
            </div>

            <div class="calendar-wrapper">
                <div class="calendar-grid" id="calendar-grid">
                    <div class="day-header">Mon</div>
                    <div class="day-header">Tue</div>
                    <div class="day-header">Wed</div>
                    <div class="day-header">Thu</div>
                    <div class="day-header">Fri</div>
                    <div class="day-header">Sat</div>
                    <div class="day-header">Sun</div>
                </div>
            </div>
        </section>

        <!-- Section 3: Cinema, Home Films & Places to Go -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">Entertainment & Places</div>
            </div>

            <div class="category-tabs">
                <button class="cat-tab active" onclick="switchCategory('cinema', this)">Cinema Films</button>
                <button class="cat-tab" onclick="switchCategory('home', this)">Home Watchlist</button>
                <button class="cat-tab" onclick="switchCategory('places', this)">Places to Go</button>
            </div>

            <div class="list-container" id="dynamic-list-view"></div>
        </section>

        <!-- Section 4: To-Do List (Who & What) -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">To-Do List (Who & What)</div>
            </div>

            <div class="list-container" id="todo-list-view"></div>
        </section>
    </main>

    <!-- Hover Card Tooltip -->
    <div id="hover-tooltip">
        <h4 id="tt-date">Date</h4>
        <div id="tt-body"></div>
    </div>

    <script>
        let events = {
            "2026-10-10": [{ title: "Football Training", color: "bg-leo", time: "10:00 AM", who: "Leo" }],
            "2026-10-15": [{ title: "Dentist Appt", color: "bg-mom", time: "02:15 PM", who: "Mom" }],
            "2026-10-17": [{ title: "Pizza & Movie Night", color: "bg-family", time: "06:30 PM", who: "Family" }],
            "2026-10-24": [
                { title: "Yorkshire Dales Walk", color: "bg-family", time: "09:30 AM", who: "Family" },
                { title: "Car Service", color: "bg-dad", time: "02:00 PM", who: "Dad" }
            ]
        };

        let categoriesData = {
            cinema: [
                { title: "The Wild Robot", details: "Release: Showing Now", meta: "Family Animation" },
                { title: "Sonic the Hedgehog 3", details: "Release: Oct 2026", meta: "Action / Family" }
            ],
            home: [
                { title: "Inside Out 2", details: "Disney+", meta: "Family Movie" },
                { title: "Paddington in Peru", details: "Streaming soon", meta: "Comedy" }
            ],
            places: [
                { title: "Yorkshire Dales National Park", details: "Scenic Walk & Picnic", postcode: "BD23 4PQ" },
                { title: "Royal Armouries Museum", details: "Interactive Exhibits", postcode: "LS10 1LT" }
            ]
        };

        let todosData = [
            { text: "Buy ingredients for Friday Pizza night", who: "Mom", color: "bg-mom" },
            { text: "Check pressure in car tires", who: "Dad", color: "bg-dad" }
        ];

        function addItem(e) {
            e.preventDefault();
            const title = document.getElementById('add-title').value;
            const category = document.getElementById('add-category').value;
            const dateStr = document.getElementById('add-date').value;
            const assignee = document.getElementById('add-assignee').value;
            const colorClass = `bg-${assignee}`;

            if (category === 'calendar' || dateStr) {
                if (!events[dateStr]) events[dateStr] = [];
                events[dateStr].push({ title, color: colorClass, time: "All Day", who: assignee });
                renderCalendar();
            }

            if (category === 'cinema' || category === 'home') {
                categoriesData[category].push({ title, details: "Newly Added", meta: "Custom" });
                switchCategory(category, document.querySelector(`.cat-tab`));
            } else if (category === 'places') {
                categoriesData.places.push({ title, details: "Custom Outing", postcode: "LS1 1AA" });
                switchCategory('places', document.querySelector(`.cat-tab`));
            } else if (category === 'todo') {
                todosData.push({ text: title, who: assignee, color: colorClass });
                renderTodos();
            }

            document.getElementById('add-title').value = '';
            alert('Successfully added to Family Hub!');
        }

        function switchCategory(cat, btn) {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const container = document.getElementById('dynamic-list-view');
            const items = categoriesData[cat];

            if (cat === 'places') {
                container.innerHTML = items.map(item => `
                    <div class="list-card">
                        <div class="list-info">
                            <h5>📍 ${item.title}</h5>
                            <span>${item.details} • <strong>${item.postcode}</strong></span>
                        </div>
                        <a href="https://maps.google.com/?q=${encodeURIComponent(item.title + ' ' + item.postcode)}" target="_blank" class="map-btn">Map ↗</a>
                    </div>
                `).join('');
            } else {
                container.innerHTML = items.map(item => `
                    <div class="list-card">
                        <div class="list-info">
                            <h5>${cat === 'cinema' ? '🍿' : '📺'} ${item.title}</h5>
                            <span>${item.details}</span>
                        </div>
                        <span style="font-size:0.7rem; color:var(--muted);">${item.meta}</span>
                    </div>
                `).join('');
            }
        }

        function renderTodos() {
            const container = document.getElementById('todo-list-view');
            container.innerHTML = todosData.map(t => `
                <div class="todo-item">
                    <div class="todo-left">
                        <input type="checkbox">
                        <span class="todo-text">${t.text}</span>
                    </div>
                    <span class="assign-tag ${t.color}">${t.who}</span>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = `
                <div class="day-header">Mon</div>
                <div class="day-header">Tue</div>
                <div class="day-header">Wed</div>
                <div class="day-header">Thu</div>
                <div class="day-header">Fri</div>
                <div class="day-header">Sat</div>
                <div class="day-header">Sun</div>
            `;

            for (let empty = 0; empty < 3; empty++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            for (let i = 1; i <= 31; i++) {
                const dayKey = `2026-10-${i < 10 ? '0' + i : i}`;
                const cell = document.createElement('div');
                cell.className = 'day-cell';

                let html = `<div class="day-num">${i}</div>`;
                if (events[dayKey]) {
                    events[dayKey].forEach(e => {
                        html += `<div class="event-pill ${e.color}">${e.title}</div>`;
                    });
                }
                cell.innerHTML = html;

                cell.addEventListener('mouseenter', (ev) => {
                    const tooltip = document.getElementById('hover-tooltip');
                    document.getElementById('tt-date').textContent = `October ${i}, 2026`;
                    const dayEvs = events[dayKey];
                    if (dayEvs && dayEvs.length) {
                        document.getElementById('tt-body').innerHTML = dayEvs.map(e => `
                            <div class="tooltip-line">
                                <span class="dot ${e.color}"></span>
                                <strong>${e.who}:</strong> ${e.title} (${e.time})
                            </div>
                        `).join('');
                    } else {
                        document.getElementById('tt-body').innerHTML = `<span style="color:var(--muted); font-size:0.75rem;">No activities</span>`;
                    }
                    tooltip.style.display = 'block';
                    tooltip.style.left = (ev.pageX + 10) + 'px';
                    tooltip.style.top = (ev.pageY + 10) + 'px';
                });

                cell.addEventListener('mousemove', (ev) => {
                    const tooltip = document.getElementById('hover-tooltip');
                    tooltip.style.left = (ev.pageX + 10) + 'px';
                    tooltip.style.top = (ev.pageY + 10) + 'px';
                });

                cell.addEventListener('mouseleave', () => {
                    document.getElementById('hover-tooltip').style.display = 'none';
                });

                grid.appendChild(cell);
            }
        }

        function setSummary(mode) {
            document.getElementById('btn-week').classList.toggle('active', mode === 'week');
            document.getElementById('btn-month').classList.toggle('active', mode === 'month');

            if (mode === 'week') {
                document.getElementById('num-events').textContent = '3';
                document.getElementById('num-tasks').textContent = todosData.length;
                document.getElementById('num-trips').textContent = '1';
                document.getElementById('summary-desc').textContent = 'Week ahead: 3 scheduled activities including Football Training and Family Movie Night.';
            } else {
                document.getElementById('num-events').textContent = '12';
                document.getElementById('num-tasks').textContent = todosData.length;
                document.getElementById('num-trips').textContent = '3';
                document.getElementById('summary-desc').textContent = 'Month ahead: 12 events scheduled including Half-Term trip to Yorkshire and 3 family days out.';
            }
        }

        renderCalendar();
        switchCategory('cinema', document.querySelector('.cat-tab'));
        renderTodos();
    </script>
</body>
</html>
