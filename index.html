<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familiplan — Family life, organised</title>
    <style>
        :root {
            --bg: #f7f5f1;
            --card: #ffffff;
            --border: #e7e2da;
            --text: #252b36;
            --muted: #6f7785;
            --accent: #6d5ce8;
            --mom: #d9468d;
            --dad: #3678d4;
            --leo: #159b75;
            --mia: #c47a08;
            --family: #805ad5;
            --shadow-soft: 0 8px 24px rgba(36, 32, 64, .055);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background:
              radial-gradient(ellipse at 12% 0%, rgba(109,92,232,.08), transparent 32rem),
              var(--bg);
            color: var(--text);
            padding-top: 65px;
            padding-bottom: 75px;
            min-height: 100vh;
            line-height: 1.45;
            overflow-x: hidden;
        }

        /* Fixed Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(30,35,50,.035);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.12rem;
            letter-spacing: -0.5px;
            color: #28253b;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Views management */
        .view {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            animation: fadeIn 0.18s ease-in-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 62px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 0.25rem;
            z-index: 1000;
            overflow-x: auto;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--muted);
            padding: 6px 4px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            flex: 1;
            min-width: 52px;
            gap: 2px;
            transition: color 0.15s ease;
            flex-shrink: 0;
        }

        .nav-item.active {
            color: var(--accent);
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1.15rem;
            line-height: 1;
        }

        /* Cards & Inputs */
        .card {
            background: rgba(255,255,255,.96);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(1rem, 2.3vw, 1.35rem);
            box-shadow: var(--shadow-soft);
            margin-bottom: 1rem;
            width: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .inline-add-group {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 12px;
        }

        .form-input, .form-select {
            background: #fff;
            border: 1px solid #dcdfe6;
            color: var(--text);
            padding: 10px 12px;
            min-height: 42px;
            font-size: 0.88rem;
            border-radius: 10px;
            outline: none;
            width: 100%;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(109,92,232,.12);
        }

        .input-full { flex: 1 1 100%; }
        .input-half { flex: 1 1 48%; }

        .add-btn, .inline-add-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            min-height: 42px;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .add-btn:hover, .inline-add-btn:hover { background: #5948d0; }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .list-empty {
            text-align: center;
            padding: 1.5rem 1rem;
            color: var(--muted);
            font-size: 0.85rem;
            border: 1px dashed var(--border);
            border-radius: 12px;
            background: #faf9ff;
            margin-bottom: 0.5rem;
        }

        .todo-item, .shopping-item, .meal-card-row, .wishlist-item, .list-card, .chore-item-row {
            background: #fff;
            border: 1px solid #e8e5df;
            border-radius: 11px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
            width: 100%;
        }

        .shopping-item.completed span, .todo-item.completed span {
            text-decoration: line-through;
            color: var(--muted);
            opacity: 0.7;
        }

        .shop-left, .todo-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .item-text-label {
            font-size: 0.88rem;
            font-weight: 500;
            flex: 1;
            word-break: break-word;
        }

        .edit-inline-input {
            font-size: 0.88rem;
            padding: 4px 8px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            outline: none;
            width: 100%;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 6px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .action-btn:hover {
            color: var(--text);
            background: #f0f0f5;
        }

        .delete-btn:hover {
            color: #ef4444;
            background: #fef2f2;
        }

        .assign-tag {
            font-size: 0.64rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            color: #fff;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .bg-mom { background-color: var(--mom); }
        .bg-dad { background-color: var(--dad); }
        .bg-leo { background-color: var(--leo); }
        .bg-mia { background-color: var(--mia); }
        .bg-family { background-color: var(--family); }

        .meal-card-row { margin-bottom: 6px; }
        .meal-day-name { font-size: 0.95rem; font-weight: 800; color: #5144b7; width: 50px; flex-shrink: 0; }
        .meal-input-inline { background: transparent; border: none; border-bottom: 1px dashed var(--border); font-size: 0.88rem; width: 100%; outline: none; }

        /* Kids Chores Grid Responsive Fix */
        .chores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            width: 100%;
        }

        /* Calendar */
        .calendar-nav { display: flex; align-items: center; gap: 8px; }
        .cal-nav-btn { background: #fff; border: 1px solid var(--border); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-header { text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
        .day-cell { background: #fff; border: 1px solid #e8e5df; border-radius: 8px; min-height: 75px; padding: 6px; cursor: pointer; }
        .day-num { font-size: 0.75rem; font-weight: 600; color: #505868; }
        .event-pill { margin-top: 3px; padding: 2px 4px; border-radius: 4px; font-size: 0.62rem; color: #fff; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="10" fill="url(#lg)"/><path d="M18 8L25 13.5V23.5C25 25 23.5 26.5 22 26.5H14C12.5 26.5 11 25 11 23.5V13.5L18 8Z" stroke="white" stroke-width="2"/><circle cx="18" cy="18" r="3.5" fill="white"/><defs><linearGradient id="lg" x1="0" y1="0" x2="36" y2="36"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg>
            </div>
            <span class="brand-text">Familiplan</span>
        </div>
        <div class="header-actions">
            <button class="logout-btn" onclick="alert('Logged out')">Log Out</button>
        </div>
    </header>

    <!-- VIEW 1: Quick Add -->
    <div id="view-home" class="view active">
        <section class="card" style="border-color: var(--accent);">
            <div class="card-header"><div class="card-title">Quick Add Item</div></div>
            <form class="add-form" onsubmit="handleQuickAdd(event)">
                <input type="text" id="add-title" class="form-input input-full" placeholder="Enter title / item / task..." required>
                <div class="form-row">
                    <select id="add-category" class="form-select input-half" onchange="handleCategoryChange(this.value)">
                        <option value="calendar">Calendar Event</option>
                        <option value="meals">Weekly Meal</option>
                        <option value="foodshop">Food Shopping</option>
                        <option value="familyshop">Family Shopping</option>
                        <option value="places">Place to Visit</option>
                        <option value="restaurants">Restaurant</option>
                        <option value="cinema">Cinema Film</option>
                        <option value="home">Home Watchlist</option>
                        <option value="todo">To-Do Task</option>
                        <option value="chores">Kid Chore</option>
                        <option value="wishlist">Gift Wishlist</option>
                    </select>
                    <select id="add-assignee" class="form-select input-half">
                        <option value="family">Family</option>
                        <option value="mom">Mom</option>
                        <option value="dad">Dad</option>
                        <option value="leo">Leo</option>
                        <option value="mia">Mia</option>
                    </select>
                </div>
                <div class="form-row" id="date-row">
                    <input type="date" id="add-date" class="form-input input-full">
                </div>
                <div class="form-row" id="postcode-row" style="display:none;">
                    <input type="text" id="add-postcode" class="form-input input-full" placeholder="Postcode (optional)">
                </div>
                <button type="submit" class="add-btn">Add to Plan</button>
            </form>
        </section>
    </div>

    <!-- VIEW 2: Calendar -->
    <div id="view-calendar" class="view">
        <section class="card">
            <div class="card-header">
                <div class="card-title" id="calendar-month-label">October 2026</div>
                <div class="calendar-nav">
                    <button class="cal-nav-btn" onclick="navigateCalendar(-1)">‹</button>
                    <button class="cal-nav-btn" onclick="navigateCalendar(1)">›</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </section>
    </div>

    <!-- VIEW 3: Shopping (With Meal Planner) -->
    <div id="view-shopping" class="view">
        <section class="card" style="margin-bottom:1rem;">
            <div class="card-header"><div class="card-title">🍽️ Weekly Meal Planner</div></div>
            <div id="meal-list-container" class="list-container"></div>
        </section>

        <section class="card" style="margin-bottom:1rem;">
            <div class="card-header"><div class="card-title">🛒 Food Shopping List</div></div>
            <div class="inline-add-group">
                <input type="text" id="foodshop-quick-input" class="form-input input-full" placeholder="Add food item..." onkeypress="if(event.key==='Enter') addInlineShop('foodshop')">
                <button class="inline-add-btn" onclick="addInlineShop('foodshop')">+ Add</button>
            </div>
            <div id="foodshop-list-container" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">🛍️ Family Shopping List</div></div>
            <div class="inline-add-group">
                <input type="text" id="familyshop-quick-input" class="form-input input-full" placeholder="Add family item..." onkeypress="if(event.key==='Enter') addInlineShop('familyshop')">
                <button class="inline-add-btn" onclick="addInlineShop('familyshop')">+ Add</button>
            </div>
            <div id="familyshop-list-container" class="list-container"></div>
        </section>
    </div>

    <!-- VIEW 4: Places & Restaurants -->
    <div id="view-places" class="view">
        <section class="card" style="margin-bottom:1rem;">
            <div class="card-header"><div class="card-title">📍 Places to Visit</div></div>
            <div id="places-list-container" class="list-container"></div>
        </section>
        <section class="card">
            <div class="card-header"><div class="card-title">🍽️ Restaurants</div></div>
            <div id="restaurants-list-container" class="list-container"></div>
        </section>
    </div>

    <!-- VIEW 5: Watchlist (Split into Cinema & Home Watchlists) -->
    <div id="view-watchlist" class="view">
        <section class="card" style="margin-bottom:1rem;">
            <div class="card-header"><div class="card-title">🎬 Cinema Watchlist</div></div>
            <div class="inline-add-group">
                <input type="text" id="cinema-quick-input" class="form-input input-full" placeholder="Add movie for cinema..." onkeypress="if(event.key==='Enter') addWatchlistItem('cinema')">
                <button class="inline-add-btn" onclick="addWatchlistItem('cinema')">+ Add</button>
            </div>
            <div id="cinema-list-container" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">📺 Home Watchlist</div></div>
            <div class="inline-add-group">
                <input type="text" id="home-quick-input" class="form-input input-full" placeholder="Add TV show or stream..." onkeypress="if(event.key==='Enter') addWatchlistItem('home')">
                <button class="inline-add-btn" onclick="addWatchlistItem('home')">+ Add</button>
            </div>
            <div id="home-list-container" class="list-container"></div>
        </section>
    </div>

    <!-- VIEW 6: To-Do & Tasks Hub -->
    <div id="view-todo" class="view">
        <section class="card">
            <div class="card-header"><div class="card-title">📝 To-Do List</div></div>
            <div class="inline-add-group">
                <input type="text" id="todo-quick-input" class="form-input input-full" placeholder="Add new task..." onkeypress="if(event.key==='Enter') addTodoItem()">
                <button class="inline-add-btn" onclick="addTodoItem()">+ Add</button>
            </div>
            <div id="todo-list-container" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">⭐ Kids' Chores</div></div>
            <div id="chores-list-container" class="chores-grid"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">🎁 Gift Wishlist</div></div>
            <div class="inline-add-group">
                <input type="text" id="wishlist-quick-input" class="form-input input-full" placeholder="Add wishlist item..." onkeypress="if(event.key==='Enter') addWishlistItem()">
                <button class="inline-add-btn" onclick="addWishlistItem()">+ Add</button>
            </div>
            <div id="wishlist-list-container" class="list-container"></div>
        </section>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button id="nav-btn-home" class="nav-item active" onclick="showView('home', this)">
            <span class="nav-icon">➕</span>
            <span>Add</span>
        </button>
        <button id="nav-btn-calendar" class="nav-item" onclick="showView('calendar', this)">
            <span class="nav-icon">📅</span>
            <span>Calendar</span>
        </button>
        <button id="nav-btn-shopping" class="nav-item" onclick="showView('shopping', this)">
            <span class="nav-icon">🛒</span>
            <span>Shopping</span>
        </button>
        <button id="nav-btn-places" class="nav-item" onclick="showView('places', this)">
            <span class="nav-icon">📍</span>
            <span>Places</span>
        </button>
        <button id="nav-btn-watchlist" class="nav-item" onclick="showView('watchlist', this)">
            <span class="nav-icon">🎬</span>
            <span>Watchlist</span>
        </button>
        <button id="nav-btn-todo" class="nav-item" onclick="showView('todo', this)">
            <span class="nav-icon">📝</span>
            <span>To-Do</span>
        </button>
    </nav>

    <script>
        let currentMonth = 9;
        let currentYear = 2026;
        const assignees = ['family', 'mom', 'dad', 'leo', 'mia'];

        let mealsData = JSON.parse(localStorage.getItem('fam_meals')) || [
            { day: "Mon", meal: "" }, { day: "Tue", meal: "" }, { day: "Wed", meal: "" },
            { day: "Thu", meal: "" }, { day: "Fri", meal: "" }, { day: "Sat", meal: "" }, { day: "Sun", meal: "" }
        ];
        let foodShopData = JSON.parse(localStorage.getItem('fam_foodshop')) || [];
        let familyShopData = JSON.parse(localStorage.getItem('fam_familyshop')) || [];
        let destinationsData = JSON.parse(localStorage.getItem('fam_destinations')) || { places: [], restaurants: [], cinema: [], home: [] };
        let choresData = JSON.parse(localStorage.getItem('fam_chores')) || [{ kid: "Leo", chores: [] }, { kid: "Mia", chores: [] }];
        let wishlistData = JSON.parse(localStorage.getItem('fam_wishlist')) || [];
        let todosData = JSON.parse(localStorage.getItem('fam_todos')) || [];
        let calendarEvents = JSON.parse(localStorage.getItem('fam_calendar')) || {};

        function saveData() {
            localStorage.setItem('fam_meals', JSON.stringify(mealsData));
            localStorage.setItem('fam_foodshop', JSON.stringify(foodShopData));
            localStorage.setItem('fam_familyshop', JSON.stringify(familyShopData));
            localStorage.setItem('fam_destinations', JSON.stringify(destinationsData));
            localStorage.setItem('fam_chores', JSON.stringify(choresData));
            localStorage.setItem('fam_wishlist', JSON.stringify(wishlistData));
            localStorage.setItem('fam_todos', JSON.stringify(todosData));
            localStorage.setItem('fam_calendar', JSON.stringify(calendarEvents));
        }

        function showView(viewId, navBtn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            if (navBtn) navBtn.classList.add('active');
            window.scrollTo(0, 0);
        }

        function handleCategoryChange(val) {
            document.getElementById('date-row').style.display = (val === 'calendar') ? 'flex' : 'none';
            document.getElementById('postcode-row').style.display = (val === 'places' || val === 'restaurants') ? 'flex' : 'none';
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-label').textContent = `${monthNames[currentMonth]} ${currentYear}`;

            let html = `<div class="day-header">Mon</div><div class="day-header">Tue</div><div class="day-header">Wed</div><div class="day-header">Thu</div><div class="day-header">Fri</div><div class="day-header">Sat</div><div class="day-header">Sun</div>`;
            const firstDay = new Date(currentYear, currentMonth, 1);
            let startDay = firstDay.getDay() - 1;
            if (startDay === -1) startDay = 6;
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < startDay; i++) html += `<div class="day-cell" style="background:transparent; border:none;"></div>`;

            for (let i = 1; i <= totalDays; i++) {
                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(i).padStart(2, '0');
                const dateKey = `${currentYear}-${mStr}-${dStr}`;
                let eventsHtml = '';
                if (calendarEvents[dateKey]) {
                    calendarEvents[dateKey].forEach(ev => eventsHtml += `<div class="event-pill bg-${ev.who}">${ev.title}</div>`);
                }
                html += `<div class="day-cell" onclick="jumpToAddEvent('${dateKey}')"><div class="day-num">${i}</div>${eventsHtml}</div>`;
            }
            grid.innerHTML = html;
        }

        function jumpToAddEvent(dateStr) {
            showView('home', document.getElementById('nav-btn-home'));
            document.getElementById('add-category').value = 'calendar';
            handleCategoryChange('calendar');
            document.getElementById('add-date').value = dateStr;
        }

        function navigateCalendar(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function renderMeals() {
            document.getElementById('meal-list-container').innerHTML = mealsData.map((m, idx) => `
                <div class="meal-card-row">
                    <div class="meal-day-name">${m.day}</div>
                    <input type="text" class="meal-input-inline" placeholder="Enter meal..." value="${m.meal}" onchange="mealsData[${idx}].meal = this.value; saveData();">
                </div>
            `).join('');
        }

        /* SHOPPING */
        function addInlineShop(type) {
            const inputId = type === 'foodshop' ? 'foodshop-quick-input' : 'familyshop-quick-input';
            const input = document.getElementById(inputId);
            if (!input || !input.value.trim()) return;
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            target.push({ text: input.value.trim(), who: 'family', done: false, isEditing: false });
            input.value = '';
            saveData();
            renderShopping();
        }

        function toggleShopCheck(type, idx) {
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            target[idx].done = !target[idx].done;
            saveData();
            renderShopping();
        }

        function enableShopEdit(type, idx) {
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            target[idx].isEditing = true;
            renderShopping();
        }

        function saveShopEdit(type, idx, newText) {
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            if (newText.trim()) target[idx].text = newText.trim();
            target[idx].isEditing = false;
            saveData();
            renderShopping();
        }

        function renderShopping() {
            const foodCont = document.getElementById('foodshop-list-container');
            const famCont = document.getElementById('familyshop-list-container');

            foodCont.innerHTML = foodShopData.length === 0 ? `<div class="list-empty">Food list empty.</div>` : foodShopData.map((item, idx) => `
                <div class="shopping-item ${item.done ? 'completed' : ''}">
                    <div class="shop-left">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShopCheck('foodshop', ${idx})">
                        ${item.isEditing ? 
                            `<input type="text" class="edit-inline-input" value="${item.text}" onkeypress="if(event.key==='Enter') saveShopEdit('foodshop', ${idx}, this.value)" onblur="saveShopEdit('foodshop', ${idx}, this.value)" autofocus>` : 
                            `<span class="item-text-label">${item.text}</span>`
                        }
                    </div>
                    <button class="action-btn" onclick="enableShopEdit('foodshop', ${idx})">✏️</button>
                    <span class="assign-tag bg-${item.who}" onclick="cycleAssignee('foodshop', ${idx})">${item.who}</span>
                    <button class="action-btn delete-btn" onclick="foodShopData.splice(${idx},1); saveData(); renderShopping();">✕</button>
                </div>
            `).join('');

            famCont.innerHTML = familyShopData.length === 0 ? `<div class="list-empty">Family list empty.</div>` : familyShopData.map((item, idx) => `
                <div class="shopping-item ${item.done ? 'completed' : ''}">
                    <div class="shop-left">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShopCheck('familyshop', ${idx})">
                        ${item.isEditing ? 
                            `<input type="text" class="edit-inline-input" value="${item.text}" onkeypress="if(event.key==='Enter') saveShopEdit('familyshop', ${idx}, this.value)" onblur="saveShopEdit('familyshop', ${idx}, this.value)" autofocus>` : 
                            `<span class="item-text-label">${item.text}</span>`
                        }
                    </div>
                    <button class="action-btn" onclick="enableShopEdit('familyshop', ${idx})">✏️</button>
                    <span class="assign-tag bg-${item.who}" onclick="cycleAssignee('familyshop', ${idx})">${item.who}</span>
                    <button class="action-btn delete-btn" onclick="familyShopData.splice(${idx},1); saveData(); renderShopping();">✕</button>
                </div>
            `).join('');
        }

        function cycleAssignee(type, index) {
            let data = type === 'foodshop' ? foodShopData : (type === 'familyshop' ? familyShopData : (type === 'wishlist' ? wishlistData : (type === 'cinema' ? destinationsData.cinema : (type === 'home' ? destinationsData.home : todosData))));
            if (!data) return;
            const currentWho = data[index].who || 'family';
            data[index].who = assignees[(assignees.indexOf(currentWho) + 1) % assignees.length];
            saveData();
            if (type === 'todo') renderTodos();
            else if (type === 'wishlist') renderWishlist();
            else if (type === 'cinema' || type === 'home') renderWatchlist();
            else renderShopping();
        }

        /* TO-DO */
        function addTodoItem() {
            const input = document.getElementById('todo-quick-input');
            if (!input || !input.value.trim()) return;
            todosData.push({ text: input.value.trim(), who: 'family', done: false, isEditing: false });
            input.value = '';
            saveData();
            renderTodos();
        }

        function toggleTodoCheck(idx) {
            todosData[idx].done = !todosData[idx].done;
            saveData();
            renderTodos();
        }

        function enableTodoEdit(idx) {
            todosData[idx].isEditing = true;
            renderTodos();
        }

        function saveTodoEdit(idx, newText) {
            if (newText.trim()) todosData[idx].text = newText.trim();
            todosData[idx].isEditing = false;
            saveData();
            renderTodos();
        }

        function renderTodos() {
            document.getElementById('todo-list-container').innerHTML = todosData.length === 0 ? `<div class="list-empty">No tasks remaining.</div>` : todosData.map((t, idx) => `
                <div class="todo-item ${t.done ? 'completed' : ''}">
                    <div class="todo-left">
                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodoCheck(${idx})">
                        ${t.isEditing ? 
                            `<input type="text" class="edit-inline-input" value="${t.text}" onkeypress="if(event.key==='Enter') saveTodoEdit(${idx}, this.value)" onblur="saveTodoEdit(${idx}, this.value)" autofocus>` : 
                            `<span class="item-text-label">${t.text}</span>`
                        }
                    </div>
                    <button class="action-btn" onclick="enableTodoEdit(${idx})">✏️</button>
                    <span class="assign-tag bg-${t.who}" onclick="cycleAssignee('todo', ${idx})">${t.who}</span>
                    <button class="action-btn delete-btn" onclick="todosData.splice(${idx},1); saveData(); renderTodos();">✕</button>
                </div>
            `).join('');
        }

        /* CHORES */
        function addKidChore(kidIndex) {
            const input = document.getElementById(`chore-input-${kidIndex}`);
            if (!input || !input.value.trim()) return;
            choresData[kidIndex].chores.push({ text: input.value.trim(), done: false });
            input.value = '';
            saveData();
            renderChores();
        }

        function deleteKidChore(kidIndex, choreIndex) {
            choresData[kidIndex].chores.splice(choreIndex, 1);
            saveData();
            renderChores();
        }

        function renderChores() {
            document.getElementById('chores-list-container').innerHTML = choresData.map((k, kIdx) => `
                <div class="card" style="margin-bottom:0; padding:12px;">
                    <div style="font-weight:800; margin-bottom:8px;">${k.kid}</div>
                    <div class="inline-add-group" style="margin-bottom:8px;">
                        <input type="text" id="chore-input-${kIdx}" class="form-input input-full" placeholder="Add chore..." style="min-height:34px; font-size:0.8rem;" onkeypress="if(event.key==='Enter') addKidChore(${kIdx})">
                        <button class="inline-add-btn" onclick="addKidChore(${kIdx})" style="min-height:34px; padding:4px 10px; font-size:0.78rem;">+</button>
                    </div>
                    <div class="list-container">
                        ${k.chores.length === 0 ? '<span style="font-size:0.8rem; color:var(--muted);">No chores</span>' : k.chores.map((c, cIdx) => {
                            const choreText = typeof c === 'string' ? c : c.text;
                            return `
                                <div class="chore-item-row" style="padding:6px 8px; font-size:0.82rem;">
                                    <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox"> ${choreText}</label>
                                    <button class="action-btn delete-btn" onclick="deleteKidChore(${kIdx},${cIdx})" style="padding:0 4px;">✕</button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        /* WISHLIST */
        function addWishlistItem() {
            const input = document.getElementById('wishlist-quick-input');
            if (!input || !input.value.trim()) return;
            wishlistData.push({ title: input.value.trim(), who: 'family' });
            input.value = '';
            saveData();
            renderWishlist();
        }

        function renderWishlist() {
            document.getElementById('wishlist-list-container').innerHTML = wishlistData.length === 0 ? `<div class="list-empty">Wishlist is empty.</div>` : wishlistData.map((w, idx) => `
                <div class="wishlist-item">
                    <span class="item-text-label">🎁 ${w.title}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="assign-tag bg-${w.who}" onclick="cycleAssignee('wishlist', ${idx})">${w.who}</span>
                        <button class="action-btn delete-btn" onclick="wishlistData.splice(${idx},1); saveData(); renderWishlist();">✕</button>
                    </div>
                </div>
            `).join('');
        }

        /* SEPARATE CINEMA & HOME WATCHLISTS */
        function addWatchlistItem(type) {
            const inputId = type === 'cinema' ? 'cinema-quick-input' : 'home-quick-input';
            const input = document.getElementById(inputId);
            if (!input || !input.value.trim()) return;
            if (!destinationsData[type]) destinationsData[type] = [];
            destinationsData[type].push({ title: input.value.trim(), who: 'family' });
            input.value = '';
            saveData();
            renderWatchlist();
        }

        function renderWatchlist() {
            const cinemaList = destinationsData.cinema || [];
            const homeList = destinationsData.home || [];

            document.getElementById('cinema-list-container').innerHTML = cinemaList.length === 0 ? `<div class="list-empty">Cinema watchlist empty.</div>` : cinemaList.map((item, idx) => `
                <div class="list-card">
                    <span class="item-text-label">🎬 ${item.title}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="assign-tag bg-${item.who}" onclick="cycleAssignee('cinema', ${idx})">${item.who}</span>
                        <button class="action-btn delete-btn" onclick="destinationsData.cinema.splice(${idx},1); saveData(); renderWatchlist();">✕</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('home-list-container').innerHTML = homeList.length === 0 ? `<div class="list-empty">Home watchlist empty.</div>` : homeList.map((item, idx) => `
                <div class="list-card">
                    <span class="item-text-label">📺 ${item.title}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="assign-tag bg-${item.who}" onclick="cycleAssignee('home', ${idx})">${item.who}</span>
                        <button class="action-btn delete-btn" onclick="destinationsData.home.splice(${idx},1); saveData(); renderWatchlist();">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function renderPlaces() {
            document.getElementById('places-list-container').innerHTML = destinationsData.places.length === 0 ? `<div class="list-empty">No places added.</div>` : destinationsData.places.map((item, idx) => `
                <div class="list-card">
                    <div><h5>📍 ${item.title}</h5><span style="font-size:0.75rem; color:var(--muted);">${item.postcode || ''}</span></div>
                    <button class="action-btn delete-btn" onclick="destinationsData.places.splice(${idx},1); saveData(); renderPlaces();">✕</button>
                </div>
            `).join('');
        }

        function renderRestaurants() {
            document.getElementById('restaurants-list-container').innerHTML = destinationsData.restaurants.length === 0 ? `<div class="list-empty">No restaurants added.</div>` : destinationsData.restaurants.map((item, idx) => `
                <div class="list-card">
                    <div><h5>🍽️ ${item.title}</h5><span style="font-size:0.75rem; color:var(--muted);">${item.postcode || ''}</span></div>
                    <button class="action-btn delete-btn" onclick="destinationsData.restaurants.splice(${idx},1); saveData(); renderRestaurants();">✕</button>
                </div>
            `).join('');
        }

        function handleQuickAdd(e) {
            e.preventDefault();
            const title = document.getElementById('add-title').value.trim();
            const category = document.getElementById('add-category').value;
            const assignee = document.getElementById('add-assignee').value;
            const dateVal = document.getElementById('add-date').value;
            const postcode = document.getElementById('add-postcode').value.trim();

            if (category === 'calendar') {
                if (!calendarEvents[dateVal]) calendarEvents[dateVal] = [];
                calendarEvents[dateVal].push({ title, who: assignee });
                renderCalendar();
            } else if (category === 'foodshop') foodShopData.push({ text: title, who: assignee, done: false, isEditing: false });
            else if (category === 'familyshop') familyShopData.push({ text: title, who: assignee, done: false, isEditing: false });
            else if (['places','restaurants'].includes(category)) destinationsData[category].push({ title, who: assignee, postcode });
            else if (['cinema','home'].includes(category)) {
                if (!destinationsData[category]) destinationsData[category] = [];
                destinationsData[category].push({ title, who: assignee });
            }
            else if (category === 'todo') todosData.push({ text: title, who: assignee, done: false, isEditing: false });
            else if (category === 'wishlist') wishlistData.push({ title, who: assignee });
            else if (category === 'chores') {
                const target = choresData.find(c => c.kid.toLowerCase() === assignee.toLowerCase()) || choresData[0];
                target.chores.push({ text: title, done: false });
                renderChores();
            } else if (category === 'meals') {
                const emptyMeal = mealsData.find(m => !m.meal);
                if (emptyMeal) emptyMeal.meal = title;
                renderMeals();
            }

            saveData();
            document.getElementById('add-title').value = '';
            document.getElementById('add-postcode').value = '';
            alert('Item added successfully!');
        }

        document.getElementById('add-date').value = new Date().toISOString().split('T')[0];
        renderCalendar();
        renderMeals();
        renderShopping();
        renderTodos();
        renderPlaces();
        renderRestaurants();
        renderWatchlist();
        renderChores();
        renderWishlist();
    </script>
</body>
</html>
