<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familiplan — Family life, organised</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #f7f5f1;
            --card: #ffffff;
            --border: #e7e2da;
            --text: #252b36;
            --muted: #6f7785;
            --accent: #6d5ce8;
            --mom: #d9468d;
            --dad: #3678d4;
            --leo: #159b75;
            --mia: #c47a08;
            --family: #805ad5;
            --shadow-soft: 0 4px 16px rgba(36, 32, 64, .04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background:
              radial-gradient(ellipse at 12% 0%, rgba(109,92,232,.08), transparent 32rem),
              var(--bg);
            color: var(--text);
            padding-top: 62px;
            padding-bottom: 65px;
            min-height: 100vh;
            line-height: 1.35;
            overflow-x: hidden;
        }

        /* Compact Unified Header Container */
        .top-header-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(30,35,50,.03);
            backdrop-filter: blur(14px);
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
        }

        .brand-text {
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: -0.4px;
            color: #28253b;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .user-selector-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f0edff;
            border: 1px solid #dcd5ff;
            padding: 3px 8px;
            border-radius: 14px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
        }

        .user-avatar-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .user-dropdown-menu {
            display: none;
            position: absolute;
            top: 34px;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 130px;
            overflow: hidden;
            z-index: 1001;
        }

        .user-dropdown-menu.open {
            display: block;
        }

        .user-dropdown-item {
            padding: 8px 10px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border-bottom: 1px solid #f2eff8;
        }

        .user-dropdown-item:hover {
            background: #faf9ff;
        }

        /* Compact View Switcher */
        .segmented-control {
            display: flex;
            background: #ede9f5;
            padding: 2px;
            border-radius: 8px;
            flex: 1;
            max-width: 200px;
        }

        .segmented-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 4px 6px;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--muted);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .segmented-btn.active {
            background: #fff;
            color: var(--accent);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .logout-btn {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Views management */
        .view {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0.6rem;
            animation: fadeIn 0.18s ease-in-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 0.2rem;
            z-index: 1000;
            overflow-x: auto;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--muted);
            padding: 4px 2px;
            font-size: 0.62rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            flex: 1;
            min-width: 46px;
            gap: 1px;
            transition: color 0.15s ease;
            flex-shrink: 0;
        }

        .nav-item.active {
            color: var(--accent);
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1rem;
            line-height: 1;
        }

        /* Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: 64px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            white-space: nowrap;
        }

        .toast-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            background: #10b981;
            color: #fff;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.55rem;
            font-weight: 800;
        }

        /* Cards & Inputs */
        .card {
            background: rgba(255,255,255,.96);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 0.85rem;
            box-shadow: var(--shadow-soft);
            margin-bottom: 0.6rem;
            width: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .inline-add-group {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-bottom: 8px;
        }

        .form-input, .form-select {
            background: #fff;
            border: 1px solid #dcdfe6;
            color: var(--text);
            padding: 6px 10px;
            min-height: 34px;
            font-size: 0.8rem;
            border-radius: 8px;
            outline: none;
            width: 100%;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(109,92,232,.12);
        }

        .input-full { flex: 1 1 100%; }
        .input-half { flex: 1 1 48%; }

        .add-btn, .inline-add-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            min-height: 34px;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .add-btn:hover, .inline-add-btn:hover { background: #5948d0; }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            width: 100%;
        }

        .list-empty {
            text-align: center;
            padding: 1rem 0.75rem;
            color: var(--muted);
            font-size: 0.78rem;
            border: 1px dashed var(--border);
            border-radius: 10px;
            background: #faf9ff;
            margin-bottom: 0.4rem;
        }

        .todo-item, .shopping-item, .meal-card-row, .wishlist-item, .list-card, .chore-item-row {
            background: #fff;
            border: 1px solid #e8e5df;
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 4px;
            width: 100%;
        }

        .shopping-item.completed span, .todo-item.completed span {
            text-decoration: line-through;
            color: var(--muted);
            opacity: 0.7;
        }

        .shop-left, .todo-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .item-text-label {
            font-size: 0.82rem;
            font-weight: 500;
            flex: 1;
            word-break: break-word;
        }

        .edit-inline-input {
            font-size: 0.82rem;
            padding: 2px 6px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            outline: none;
            width: 100%;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .action-btn:hover {
            color: var(--text);
            background: #f0f0f5;
        }

        .delete-btn:hover {
            color: #ef4444;
            background: #fef2f2;
        }

        .assign-tag {
            font-size: 0.58rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 14px;
            color: #fff;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .bg-mom { background-color: var(--mom); }
        .bg-dad { background-color: var(--dad); }
        .bg-leo { background-color: var(--leo); }
        .bg-mia { background-color: var(--mia); }
        .bg-family { background-color: var(--family); }

        .meal-card-row { margin-bottom: 4px; }
        .meal-day-name { font-size: 0.85rem; font-weight: 800; color: #5144b7; width: 42px; flex-shrink: 0; }
        .meal-input-inline { background: transparent; border: none; border-bottom: 1px dashed var(--border); font-size: 0.82rem; width: 100%; outline: none; }

        .chores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
            width: 100%;
        }

        /* Leaflet Map Height & Framing */
        #places-map {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        /* Calendar */
        .calendar-nav { display: flex; align-items: center; gap: 6px; }
        .cal-nav-btn { background: #fff; border: 1px solid var(--border); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-header { text-align: center; font-size: 0.65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
        .day-cell { background: #fff; border: 1px solid #e8e5df; border-radius: 6px; min-height: 60px; padding: 4px; cursor: pointer; }
        .day-num { font-size: 0.7rem; font-weight: 600; color: #505868; }
        .event-pill { margin-top: 2px; padding: 1px 3px; border-radius: 3px; font-size: 0.58rem; color: #fff; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Toast Banner Container -->
    <div id="toast-banner" class="toast-notification">
        <span class="toast-icon">✓</span>
        <span id="toast-message">Item added successfully!</span>
    </div>

    <!-- Compact Top Header & Switcher Row -->
    <div class="top-header-container">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="10" fill="url(#lg)"/><path d="M18 8L25 13.5V23.5C25 25 23.5 26.5 22 26.5H14C12.5 26.5 11 25 11 23.5V13.5L18 8Z" stroke="white" stroke-width="2"/><circle cx="18" cy="18" r="3.5" fill="white"/><defs><linearGradient id="lg" x1="0" y1="0" x2="36" y2="36"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg>
            </div>
            <span class="brand-text">Familiplan</span>
        </div>

        <div class="segmented-control">
            <button id="toggle-btn-user" class="segmented-btn" onclick="setViewMode('user')">👤 Mine</button>
            <button id="toggle-btn-family" class="segmented-btn active" onclick="setViewMode('family')">👨‍👩‍👧‍👦 Family</button>
        </div>

        <div class="header-actions">
            <button class="user-selector-btn" onclick="toggleUserDropdown()">
                <span id="current-user-dot" class="user-avatar-dot bg-dad"></span>
                <span id="current-user-name">Dad</span>
                <span style="font-size:0.55rem;">▼</span>
            </button>
            <div id="user-dropdown" class="user-dropdown-menu">
                <div class="user-dropdown-item" onclick="selectUser('dad', 'Dad')"><span class="user-avatar-dot bg-dad"></span> Dad</div>
                <div class="user-dropdown-item" onclick="selectUser('mom', 'Mom')"><span class="user-avatar-dot bg-mom"></span> Mom</div>
                <div class="user-dropdown-item" onclick="selectUser('leo', 'Leo')"><span class="user-avatar-dot bg-leo"></span> Leo</div>
                <div class="user-dropdown-item" onclick="selectUser('mia', 'Mia')"><span class="user-avatar-dot bg-mia"></span> Mia</div>
            </div>
            <button class="logout-btn" onclick="showToast('Logged out')">Exit</button>
        </div>
    </div>

    <!-- VIEW 1: Quick Add -->
    <div id="view-home" class="view active">
        <section class="card" style="border-color: var(--accent);">
            <div class="card-header"><div class="card-title">Quick Add Item</div></div>
            <form class="add-form" onsubmit="handleQuickAdd(event)">
                <input type="text" id="add-title" class="form-input input-full" placeholder="Enter title / item / task..." required>
                <div class="form-row">
                    <select id="add-category" class="form-select input-half" onchange="handleCategoryChange(this.value)">
                        <option value="calendar">Calendar Event</option>
                        <option value="meals">Weekly Meal</option>
                        <option value="foodshop">Food Shopping</option>
                        <option value="familyshop">Family Shopping</option>
                        <option value="places">Place to Visit</option>
                        <option value="restaurants">Restaurant</option>
                        <option value="cinema">Cinema Film</option>
                        <option value="home">Home Watchlist</option>
                        <option value="todo">To-Do Task</option>
                        <option value="chores">Kid Chore</option>
                        <option value="wishlist">Gift Wishlist</option>
                    </select>
                    <select id="add-assignee" class="form-select input-half">
                        <option value="family">Family</option>
                        <option value="mom">Mom</option>
                        <option value="dad">Dad</option>
                        <option value="leo">Leo</option>
                        <option value="mia">Mia</option>
                    </select>
                </div>
                <div class="form-row" id="date-row">
                    <input type="date" id="add-date" class="form-input input-full">
                </div>
                <div class="form-row" id="postcode-row" style="display:none;">
                    <input type="text" id="add-postcode" class="form-input input-full" placeholder="Postcode (e.g. YO25 5YR)">
                </div>
                <button type="submit" class="add-btn">Add to Plan</button>
            </form>
        </section>
    </div>

    <!-- VIEW 2: Calendar -->
    <div id="view-calendar" class="view">
        <section class="card">
            <div class="card-header">
                <div class="card-title" id="calendar-month-label">October 2026</div>
                <div class="calendar-nav">
                    <button class="cal-nav-btn" onclick="navigateCalendar(-1)">‹</button>
                    <button class="cal-nav-btn" onclick="navigateCalendar(1)">›</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </section>
    </div>

    <!-- VIEW 3: Shopping -->
    <div id="view-shopping" class="view">
        <section class="card" style="margin-bottom:0.6rem;">
            <div class="card-header"><div class="card-title">🍽️ Weekly Meal Planner</div></div>
            <div id="meal-list-container" class="list-container"></div>
        </section>

        <section class="card" style="margin-bottom:0.6rem;">
            <div class="card-header"><div class="card-title">🛒 Food Shopping List</div></div>
            <div class="inline-add-group">
                <input type="text" id="foodshop-quick-input" class="form-input input-full" placeholder="Add food item..." onkeypress="if(event.key==='Enter') addInlineShop('foodshop')">
                <button class="inline-add-btn" onclick="addInlineShop('foodshop')">+ Add</button>
            </div>
            <div id="foodshop-list-container" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">🛍️ Family Shopping List</div></div>
            <div class="inline-add-group">
                <input type="text" id="familyshop-quick-input" class="form-input input-full" placeholder="Add family item..." onkeypress="if(event.key==='Enter') addInlineShop('familyshop')">
                <button class="inline-add-btn" onclick="addInlineShop('familyshop')">+ Add</button>
            </div>
            <div id="familyshop-list-container" class="list-container"></div>
        </section>
    </div>

    <!-- VIEW 4: Places & Restaurants with Map & Section Toggle -->
    <div id="view-places" class="view">
        <div style="margin-bottom: 0.6rem;">
            <div class="segmented-control" style="max-width: 100%;">
                <button id="places-tab-btn" class="segmented-btn active" onclick="switchPlacesSubTab('places')">📍 Places to Visit</button>
                <button id="restaurants-tab-btn" class="segmented-btn" onclick="switchPlacesSubTab('restaurants')">🍽️ Restaurants</button>
            </div>
        </div>

        <section class="card" style="margin-bottom:0.6rem;">
            <div class="card-header">
                <div class="card-title" id="places-card-title">📍 Places to Visit</div>
            </div>
            <div class="inline-add-group">
                <input type="text" id="places-name-input" class="form-input" style="flex:2;" placeholder="Name...">
                <input type="text" id="places-postcode-input" class="form-input" style="flex:1;" placeholder="Postcode...">
                <button class="inline-add-btn" onclick="addPlacesItem()">+ Add</button>
            </div>
            <div id="places-dynamic-list-container" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">🗺️ Interactive Map</div></div>
            <div id="places-map"></div>
        </section>
    </div>

    <!-- VIEW 5: Watchlist -->
    <div id="view-watchlist" class="view">
        <section class="card" style="margin-bottom:0.6rem;">
            <div class="card-header"><div class="card-title">🎬 Cinema Watchlist</div></div>
            <div class="inline-add-group">
                <input type="text" id="cinema-quick-input" class="form-input input-full" placeholder="Add movie..." onkeypress="if(event.key==='Enter') addWatchlistItem('cinema')">
                <button class="inline-add-btn" onclick="addWatchlistItem('cinema')">+ Add</button>
            </div>
            <div id="cinema-list-container" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">📺 Home Watchlist</div></div>
            <div class="inline-add-group">
                <input type="text" id="home-quick-input" class="form-input input-full" placeholder="Add TV show..." onkeypress="if(event.key==='Enter') addWatchlistItem('home')">
                <button class="inline-add-btn" onclick="addWatchlistItem('home')">+ Add</button>
            </div>
            <div id="home-list-container" class="list-container"></div>
        </section>
    </div>

    <!-- VIEW 6: To-Do & Tasks Hub -->
    <div id="view-todo" class="view">
        <section class="card">
            <div class="card-header"><div class="card-title">📝 To-Do List</div></div>
            <div class="inline-add-group">
                <input type="text" id="todo-quick-input" class="form-input input-full" placeholder="Add task..." onkeypress="if(event.key==='Enter') addTodoItem()">
                <button class="inline-add-btn" onclick="addTodoItem()">+ Add</button>
            </div>
            <div id="todo-list-container" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">⭐ Kids' Chores</div></div>
            <div id="chores-list-container" class="chores-grid"></div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">🎁 Gift Wishlist</div></div>
            <div class="inline-add-group">
                <input type="text" id="wishlist-quick-input" class="form-input input-full" placeholder="Add item..." onkeypress="if(event.key==='Enter') addWishlistItem()">
                <button class="inline-add-btn" onclick="addWishlistItem()">+ Add</button>
            </div>
            <div id="wishlist-list-container" class="list-container"></div>
        </section>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button id="nav-btn-home" class="nav-item active" onclick="showView('home', this)">
            <span class="nav-icon">➕</span>
            <span>Add</span>
        </button>
        <button id="nav-btn-calendar" class="nav-item" onclick="showView('calendar', this)">
            <span class="nav-icon">📅</span>
            <span>Calendar</span>
        </button>
        <button id="nav-btn-shopping" class="nav-item" onclick="showView('shopping', this)">
            <span class="nav-icon">🛒</span>
            <span>Shopping</span>
        </button>
        <button id="nav-btn-places" class="nav-item" onclick="showView('places', this)">
            <span class="nav-icon">📍</span>
            <span>Places</span>
        </button>
        <button id="nav-btn-watchlist" class="nav-item" onclick="showView('watchlist', this)">
            <span class="nav-icon">🎬</span>
            <span>Watchlist</span>
        </button>
        <button id="nav-btn-todo" class="nav-item" onclick="showView('todo', this)">
            <span class="nav-icon">📝</span>
            <span>To-Do</span>
        </button>
    </nav>

    <!-- Leaflet JS Library for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let currentMonth = 9;
        let currentYear = 2026;
        const assignees = ['family', 'mom', 'dad', 'leo', 'mia'];

        let currentUser = localStorage.getItem('fam_user') || 'dad';
        let currentUserName = localStorage.getItem('fam_user_name') || 'Dad';
        let viewMode = localStorage.getItem('fam_view_mode') || 'family';
        let activePlacesTab = 'places';

        let mealsData = JSON.parse(localStorage.getItem('fam_meals')) || [
            { day: "Mon", meal: "" }, { day: "Tue", meal: "" }, { day: "Wed", meal: "" },
            { day: "Thu", meal: "" }, { day: "Fri", meal: "" }, { day: "Sat", meal: "" }, { day: "Sun", meal: "" }
        ];
        let foodShopData = JSON.parse(localStorage.getItem('fam_foodshop')) || [];
        let familyShopData = JSON.parse(localStorage.getItem('fam_familyshop')) || [];
        let destinationsData = JSON.parse(localStorage.getItem('fam_destinations')) || { 
            places: [{ title: "Zoo", postcode: "YO25 5YR", who: "family" }, { title: "Nicky", postcode: "NG4 1BA", who: "dad" }], 
            restaurants: [{ title: "5 guys", postcode: "", who: "family" }, { title: "Jodhpur", postcode: "", who: "family" }], 
            cinema: [], home: [] 
        };
        let choresData = JSON.parse(localStorage.getItem('fam_chores')) || [{ kid: "Leo", chores: [] }, { kid: "Mia", chores: [] }];
        let wishlistData = JSON.parse(localStorage.getItem('fam_wishlist')) || [];
        let todosData = JSON.parse(localStorage.getItem('fam_todos')) || [];
        let calendarEvents = JSON.parse(localStorage.getItem('fam_calendar')) || {};

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast-banner');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function saveData() {
            localStorage.setItem('fam_meals', JSON.stringify(mealsData));
            localStorage.setItem('fam_foodshop', JSON.stringify(foodShopData));
            localStorage.setItem('fam_familyshop', JSON.stringify(familyShopData));
            localStorage.setItem('fam_destinations', JSON.stringify(destinationsData));
            localStorage.setItem('fam_chores', JSON.stringify(choresData));
            localStorage.setItem('fam_wishlist', JSON.stringify(wishlistData));
            localStorage.setItem('fam_todos', JSON.stringify(todosData));
            localStorage.setItem('fam_calendar', JSON.stringify(calendarEvents));
            localStorage.setItem('fam_user', currentUser);
            localStorage.setItem('fam_user_name', currentUserName);
            localStorage.setItem('fam_view_mode', viewMode);
        }

        /* USER PROFILE & VIEW MODE MANAGEMENT */
        function toggleUserDropdown() {
            document.getElementById('user-dropdown').classList.toggle('open');
        }

        function selectUser(userKey, userName) {
            currentUser = userKey;
            currentUserName = userName;
            document.getElementById('current-user-name').textContent = userName;
            const dot = document.getElementById('current-user-dot');
            dot.className = `user-avatar-dot bg-${userKey}`;
            toggleUserDropdown();
            saveData();
            renderAllViews();
            showToast(`Switched to ${userName}`);
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('toggle-btn-user').classList.toggle('active', mode === 'user');
            document.getElementById('toggle-btn-family').classList.toggle('active', mode === 'family');
            saveData();
            renderAllViews();
        }

        function filterItem(itemWho) {
            if (viewMode === 'family') return true;
            return itemWho === currentUser || itemWho === 'family';
        }

        function showView(viewId, navBtn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            if (navBtn) navBtn.classList.add('active');
            window.scrollTo(0, 0);

            if (viewId === 'places') {
                setTimeout(() => {
                    initMap();
                }, 50);
            }
        }

        function handleCategoryChange(val) {
            document.getElementById('date-row').style.display = (val === 'calendar') ? 'flex' : 'none';
            document.getElementById('postcode-row').style.display = (val === 'places' || val === 'restaurants') ? 'flex' : 'none';
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-label').textContent = `${monthNames[currentMonth]} ${currentYear}`;

            let html = `<div class="day-header">Mon</div><div class="day-header">Tue</div><div class="day-header">Wed</div><div class="day-header">Thu</div><div class="day-header">Fri</div><div class="day-header">Sat</div><div class="day-header">Sun</div>`;
            const firstDay = new Date(currentYear, currentMonth, 1);
            let startDay = firstDay.getDay() - 1;
            if (startDay === -1) startDay = 6;
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < startDay; i++) html += `<div class="day-cell" style="background:transparent; border:none;"></div>`;

            for (let i = 1; i <= totalDays; i++) {
                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(i).padStart(2, '0');
                const dateKey = `${currentYear}-${mStr}-${dStr}`;
                let eventsHtml = '';
                if (calendarEvents[dateKey]) {
                    calendarEvents[dateKey].filter(ev => filterItem(ev.who)).forEach(ev => eventsHtml += `<div class="event-pill bg-${ev.who}">${ev.title}</div>`);
                }
                html += `<div class="day-cell" onclick="jumpToAddEvent('${dateKey}')"><div class="day-num">${i}</div>${eventsHtml}</div>`;
            }
            grid.innerHTML = html;
        }

        function jumpToAddEvent(dateStr) {
            showView('home', document.getElementById('nav-btn-home'));
            document.getElementById('add-category').value = 'calendar';
            handleCategoryChange('calendar');
            document.getElementById('add-date').value = dateStr;
        }

        function navigateCalendar(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function renderMeals() {
            document.getElementById('meal-list-container').innerHTML = mealsData.map((m, idx) => `
                <div class="meal-card-row">
                    <div class="meal-day-name">${m.day}</div>
                    <input type="text" class="meal-input-inline" placeholder="Enter meal..." value="${m.meal}" onchange="mealsData[${idx}].meal = this.value; saveData();">
                </div>
            `).join('');
        }

        /* SHOPPING */
        function addInlineShop(type) {
            const inputId = type === 'foodshop' ? 'foodshop-quick-input' : 'familyshop-quick-input';
            const input = document.getElementById(inputId);
            if (!input || !input.value.trim()) return;
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            target.push({ text: input.value.trim(), who: currentUser, done: false, isEditing: false });
            input.value = '';
            saveData();
            renderShopping();
            showToast('Item added to list');
        }

        function toggleShopCheck(type, idx) {
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            target[idx].done = !target[idx].done;
            saveData();
            renderShopping();
        }

        function enableShopEdit(type, idx) {
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            target[idx].isEditing = true;
            renderShopping();
        }

        function saveShopEdit(type, idx, newText) {
            const target = type === 'foodshop' ? foodShopData : familyShopData;
            if (newText.trim()) target[idx].text = newText.trim();
            target[idx].isEditing = false;
            saveData();
            renderShopping();
        }

        function renderShopping() {
            const foodCont = document.getElementById('foodshop-list-container');
            const famCont = document.getElementById('familyshop-list-container');

            const filteredFood = foodShopData.filter(item => filterItem(item.who));
            foodCont.innerHTML = filteredFood.length === 0 ? `<div class="list-empty">Food list empty.</div>` : foodShopData.map((item, idx) => {
                if (!filterItem(item.who)) return '';
                return `
                    <div class="shopping-item ${item.done ? 'completed' : ''}">
                        <div class="shop-left">
                            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShopCheck('foodshop', ${idx})">
                            ${item.isEditing ? 
                                `<input type="text" class="edit-inline-input" value="${item.text}" onkeypress="if(event.key==='Enter') saveShopEdit('foodshop', ${idx}, this.value)" onblur="saveShopEdit('foodshop', ${idx}, this.value)" autofocus>` : 
                                `<span class="item-text-label">${item.text}</span>`
                            }
                        </div>
                        <button class="action-btn" onclick="enableShopEdit('foodshop', ${idx})">✏️</button>
                        <span class="assign-tag bg-${item.who}" onclick="cycleAssignee('foodshop', ${idx})">${item.who}</span>
                        <button class="action-btn delete-btn" onclick="foodShopData.splice(${idx},1); saveData(); renderShopping();">✕</button>
                    </div>
                `;
            }).join('');

            const filteredFam = familyShopData.filter(item => filterItem(item.who));
            famCont.innerHTML = filteredFam.length === 0 ? `<div class="list-empty">Family list empty.</div>` : familyShopData.map((item, idx) => {
                if (!filterItem(item.who)) return '';
                return `
                    <div class="shopping-item ${item.done ? 'completed' : ''}">
                        <div class="shop-left">
                            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShopCheck('familyshop', ${idx})">
                            ${item.isEditing ? 
                                `<input type="text" class="edit-inline-input" value="${item.text}" onkeypress="if(event.key==='Enter') saveShopEdit('familyshop', ${idx}, this.value)" onblur="saveShopEdit('familyshop', ${idx}, this.value)" autofocus>` : 
                                `<span class="item-text-label">${item.text}</span>`
                            }
                        </div>
                        <button class="action-btn" onclick="enableShopEdit('familyshop', ${idx})">✏️</button>
                        <span class="assign-tag bg-${item.who}" onclick="cycleAssignee('familyshop', ${idx})">${item.who}</span>
                        <button class="action-btn delete-btn" onclick="familyShopData.splice(${idx},1); saveData(); renderShopping();">✕</button>
                    </div>
                `;
            }).join('');
        }

        function cycleAssignee(type, index) {
            let data = type === 'foodshop' ? foodShopData : (type === 'familyshop' ? familyShopData : (type === 'wishlist' ? wishlistData : (type === 'cinema' ? destinationsData.cinema : (type === 'home' ? destinationsData.home : todosData))));
            if (!data) return;
            const currentWho = data[index].who || 'family';
            data[index].who = assignees[(assignees.indexOf(currentWho) + 1) % assignees.length];
            saveData();
            renderAllViews();
        }

        /* PLACES & RESTAURANTS WITH MAP */
        function switchPlacesSubTab(tab) {
            activePlacesTab = tab;
            document.getElementById('places-tab-btn').classList.toggle('active', tab === 'places');
            document.getElementById('restaurants-tab-btn').classList.toggle('active', tab === 'restaurants');
            document.getElementById('places-card-title').textContent = tab === 'places' ? '📍 Places to Visit' : '🍽️ Restaurants';
            renderPlacesView();
        }

        function addPlacesItem() {
            const nameInput = document.getElementById('places-name-input');
            const pcInput = document.getElementById('places-postcode-input');
            if (!nameInput || !nameInput.value.trim()) return;

            destinationsData[activePlacesTab].push({
                title: nameInput.value.trim(),
                postcode: pcInput.value.trim(),
                who: currentUser
            });

            nameInput.value = '';
            pcInput.value = '';
            saveData();
            renderPlacesView();
            showToast('Location added');
        }

        function renderPlacesView() {
            const container = document.getElementById('places-dynamic-list-container');
            const list = destinationsData[activePlacesTab] || [];
            const filtered = list.filter(item => filterItem(item.who));

            container.innerHTML = filtered.length === 0 ? `<div class="list-empty">No ${activePlacesTab} added yet.</div>` : list.map((item, idx) => {
                if (!filterItem(item.who)) return '';
                return `
                    <div class="list-card">
                        <div>
                            <h5>${activePlacesTab === 'places' ? '📍' : '🍽️'} ${item.title}</h5>
                            ${item.postcode ? `<span style="font-size:0.7rem; color:var(--muted);">${item.postcode}</span>` : ''}
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span class="assign-tag bg-${item.who}">${item.who}</span>
                            <button class="action-btn delete-btn" onclick="destinationsData['${activePlacesTab}'].splice(${idx},1); saveData(); renderPlacesView();">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            initMap();
        }

        let mapInstance = null;
        let mapMarkers = [];

        async function initMap() {
            const mapContainer = document.getElementById('places-map');
            if (!mapContainer) return;

            if (!mapInstance) {
                mapInstance = L.map('places-map').setView([54.0, -2.5], 6);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(mapInstance);

                const resizeObserver = new ResizeObserver(() => {
                    if (mapInstance) mapInstance.invalidateSize();
                });
                resizeObserver.observe(mapContainer);
            }

            mapInstance.invalidateSize();

            mapMarkers.forEach(m => mapInstance.removeLayer(m));
            mapMarkers = [];

            const allLocations = [
                ...(destinationsData.places || []).map(p => ({ ...p, type: 'place' })),
                ...(destinationsData.restaurants || []).map(r => ({ ...r, type: 'restaurant' }))
            ].filter(item => filterItem(item.who));

            const bounds = [];

            for (const item of allLocations) {
                if (!item.postcode) continue;
                try {
                    const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(item.postcode)}`);
                    const data = await res.json();
                    if (data.status === 200) {
                        const { latitude, longitude } = data.result;
                        const marker = L.marker([latitude, longitude]).addTo(mapInstance);
                        marker.bindPopup(`<b>${item.type === 'place' ? '📍' : '🍽️'} ${item.title}</b><br>${item.postcode}`);
                        mapMarkers.push(marker);
                        bounds.push([latitude, longitude]);
                    }
                } catch (e) {
                    console.error("Geocoding error:", e);
                }
            }

            if (bounds.length > 0) {
                mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
            } else {
                mapInstance.setView([54.0, -2.5], 6);
            }
        }

        /* TO-DO */
        function addTodoItem() {
            const input = document.getElementById('todo-quick-input');
            if (!input || !input.value.trim()) return;
            todosData.push({ text: input.value.trim(), who: currentUser, done: false, isEditing: false });

            saveData();
            renderTodos();

        function toggleTodoCheck(idx) {

        function enableTodoEdit(idx) {

        }

        function saveTodoEdit(idx, newText) {

            saveData();
            renderTodos();

                                `<span class="item-text-label">${t.text}</span>`
                            }
                        </div>
                        <button class="action-btn" onclick="enableTodoEdit(${idx})">✏️</button>
                        <span class="assign-tag bg-${t.who}" onclick="cycleAssignee('todo', ${idx})">${t.who}</span>
                        <button class="action-btn delete-btn" onclick="todosData.splice(${idx},1); saveData(); renderTodos();">✕</button>
                    </div>
                `;
            }).join('');
        }

        /* CHORES */
        function addKidChore(kidIndex) {
            const input = document.getElementById(`chore-input-${kidIndex}`);
            if (!input || !input.value.trim()) return;
            choresData[kidIndex].chores.push({ text: input.value.trim(), done: false });
            input.value = '';
            saveData();
            renderChores();
            showToast('Chore added');
        }

        function deleteKidChore(kidIndex, choreIndex) {
            choresData[kidIndex].chores.splice(choreIndex, 1);
            saveData();
            renderChores();
        }

        function renderChores() {
            document.getElementById('chores-list-container').innerHTML = choresData.map((k, kIdx) => `
                <div class="card" style="margin-bottom:0; padding:10px;">
                    <div style="font-weight:800; font-size:0.85rem; margin-bottom:6px;">${k.kid}</div>
                    <div class="inline-add-group" style="margin-bottom:6px;">
                        <input type="text" id="chore-input-${kIdx}" class="form-input input-full" placeholder="Add chore..." style="min-height:30px; font-size:0.75rem;" onkeypress="if(event.key==='Enter') addKidChore(${kIdx})">
                        <button class="inline-add-btn" onclick="addKidChore(${kIdx})" style="min-height:30px; padding:2px 8px; font-size:0.75rem;">+</button>
                    </div>
                    <div class="list-container">
                        ${k.chores.length === 0 ? '<span style="font-size:0.75rem; color:var(--muted);">No chores</span>' : k.chores.map((c, cIdx) => {
                            const choreText = typeof c === 'string' ? c : c.text;
                            return `
                                <div class="chore-item-row" style="padding:4px 6px; font-size:0.78rem;">
                                    <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox"> ${choreText}</label>
                                    <button class="action-btn delete-btn" onclick="deleteKidChore(${kIdx},${cIdx})" style="padding:0 3px;">✕</button>

                </div>

        }

        /* WISHLIST */
        function addWishlistItem() {
            const input = document.getElementById('wishlist-quick-input');
            if (!input || !input.value.trim()) return;
            wishlistData.push({ title: input.value.trim(), who: currentUser });
            input.value = '';
            saveData();
            renderWishlist();
            showToast('Added to wishlist');
        }

        function renderWishlist() {
            const filtered = wishlistData.filter(w => filterItem(w.who));
            document.getElementById('wishlist-list-container').innerHTML = filtered.length === 0 ? `<div class="list-empty">Wishlist is empty.</div>` : wishlistData.map((w, idx) => {
                if (!filterItem(w.who)) return '';
                return `
                    <div class="wishlist-item">
                        <span class="item-text-label">🎁 ${w.title}</span>
                        <div style="display:flex; align-items:center; gap:6px;">

                    </div>

        /* WATCHLIST */
        function addWatchlistItem(type) {
            const inputId = type === 'cinema' ? 'cinema-quick-input' : 'home-quick-input';
            const input = document.getElementById(inputId);
            if (!input || !input.value.trim()) return;
            if (!destinationsData[type]) destinationsData[type] = [];
            destinationsData[type].push({ title: input.value.trim(), who: currentUser });
            input.value = '';
            saveData();
            renderWatchlist();
            showToast('Added to watchlist');

        function renderWatchlist() {

            const homeList = (destinationsData.home || []).filter(item => filterItem(item.who));

            document.getElementById('cinema-list-container').innerHTML = cinemaList.length === 0 ? `<div class="list-empty">Cinema watchlist empty.</div>` : (destinationsData.cinema || []).map((item, idx) => {

        function handleQuickAdd(e) {
            e.preventDefault();
            const title = document.getElementById('add-title').value.trim();
            const category = document.getElementById('add-category').value;
            const assignee = document.getElementById('add-assignee').value;
            const dateVal = document.getElementById('add-date').value;
            const postcode = document.getElementById('add-postcode').value.trim();

            if (category === 'calendar') {
                if (!calendarEvents[dateVal]) calendarEvents[dateVal] = [];
                calendarEvents[dateVal].push({ title, who: assignee });
            } else if (category === 'foodshop') foodShopData.push({ text: title, who: assignee, done: false, isEditing: false });
            else if (category === 'familyshop') familyShopData.push({ text: title, who: assignee, done: false, isEditing: false });
            else if (['places','restaurants'].includes(category)) destinationsData[category].push({ title, who: assignee, postcode });
            else if (['cinema','home'].includes(category)) {
                if (!destinationsData[category]) destinationsData[category] = [];
                destinationsData[category].push({ title, who: assignee });
            }
            else if (category === 'todo') todosData.push({ text: title, who: assignee, done: false, isEditing: false });
            else if (category === 'wishlist') wishlistData.push({ title, who: assignee });
            else if (category === 'chores') {
                const target = choresData.find(c => c.kid.toLowerCase() === assignee.toLowerCase()) || choresData[0];
                target.chores.push({ text: title, done: false });
            } else if (category === 'meals') {
                const emptyMeal = mealsData.find(m => !m.meal);
                if (emptyMeal) emptyMeal.meal = title;
            }

            saveData();
            document.getElementById('add-title').value = '';
            document.getElementById('add-postcode').value = '';
            renderAllViews();
            showToast('Item added successfully!');
        }

        function renderAllViews() {
            renderCalendar();
            renderMeals();
            renderShopping();
            renderTodos();
            renderPlacesView();
            renderWatchlist();
            renderChores();
            renderWishlist();
        }

        document.getElementById('add-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('current-user-name').textContent = currentUserName;
        document.getElementById('current-user-dot').className = `user-avatar-dot bg-${currentUser}`;
        document.getElementById('toggle-btn-user').classList.toggle('active', viewMode === 'user');
        document.getElementById('toggle-btn-family').classList.toggle('active', viewMode === 'family');
        
        renderAllViews();
    </script>
</body>
</html>
